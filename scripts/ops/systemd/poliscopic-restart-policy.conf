# Bounded restart policy for the production service.
#
# The 2026-09-14 incident produced over 2,300 restart attempts while workers
# failed to boot, which masked the real error and hammered the host.  These
# limits stop the loop: once StartLimitBurst starts happen inside
# StartLimitIntervalSec, systemd stops restarting and the unit enters a failed
# state.  The external 15-minute health watcher then reports it.
#
# Install as /etc/systemd/system/poliscopic.service.d/restart-policy.conf
# then: systemctl daemon-reload

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=10

[Service]
Restart=always
RestartSec=10
