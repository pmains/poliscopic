# public-safety.yaml — Public Safety & Justice newsletter
name: public-safety
description: "Public Safety & Justice newsletter — sheriff, police, fire, courts, corrections"
display_name: "Public Safety & Justice Weekly Digest"
max_run_minutes: 180
max_retries: 2
embedding_query: "Public safety and criminal justice policy issues: sheriff operations, police departments, law enforcement contracts, police equipment, police reform, fire departments, fire stations, emergency response, corrections, jails, detention centers, inmate services, courts, court administration, court funding, court programs, emergency management, 911 dispatch, first responder programs, body cameras, records systems, public safety technology, crime prevention, community policing, homeland security, disaster response"

steps:
  - name: classify
    instructions: "workflows/public-safety/01-classify/instructions.md"
    output_dir: "{RUN_DIR}/staged/"
    timeout_min: 30
    max_retries: 2
  - name: enrich
    instructions: "workflows/shared/02-enrich/instructions.md"
    input_dir: "{RUN_DIR}/staged/"
    output_dir: "{RUN_DIR}/enriched/"
    timeout_min: 10
    max_retries: 2
  - name: summarize
    instructions: "workflows/shared/03-summarize/instructions.md"
    input_dir: "{RUN_DIR}/enriched/"
    output_dir: "{RUN_DIR}/summarized/"
    timeout_min: 30
    max_retries: 2
  - name: verify
    instructions: "workflows/shared/04-verify/instructions.md"
    input_dir: "{RUN_DIR}/summarized/"
    output_dir: "{RUN_DIR}/verified/"
    timeout_min: 15
    max_retries: 2
  - name: send
    instructions: "workflows/shared/05-send/instructions.md"
    input_dir: "{RUN_DIR}/verified/"
    output_dir: "{RUN_DIR}/send-output/"
    timeout_min: 5
    max_retries: 1
  - name: publish
    instructions: "workflows/shared/06-publish/instructions.md"
    input_dir: "{RUN_DIR}/verified/"
    output_dir: "{RUN_DIR}/publish-output/"
    timeout_min: 15
    max_retries: 1
