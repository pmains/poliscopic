# housing.yaml — Housing & Development newsletter
name: housing
description: "Housing & Development newsletter — rezoning, affordable housing, ADUs, development"
display_name: "Housing & Development Weekly Digest"
max_run_minutes: 180
max_retries: 2
embedding_query: "Housing and development policy issues: rezoning, zoning map amendments, zoning code amendments, general plan amendments, affordable housing, ADUs, accessory dwelling units, multifamily housing, apartments, subdivision maps, lot splits, housing authority, development agreements, land use changes, planned area developments, residential development, housing trust funds, HOME funds, CDBG, housing moratoriums, use permits, variance requests, setback variances, garage conversions, special use permits, home-based businesses, transitional housing, homeless services, community development block grants, capital improvement plans, housing stability programs, abatement appeals, code enforcement"

steps:
  - name: classify
    instructions: "workflows/housing/01-classify/instructions.md"
    output_dir: "{RUN_DIR}/staged/"
    timeout_min: 30
    max_retries: 2
  - name: enrich
    instructions: "workflows/shared/02-enrich/instructions.md"
    input_dir: "{RUN_DIR}/staged/"
    output_dir: "{RUN_DIR}/enriched/"
    timeout_min: 10
    max_retries: 2
  - name: summarize
    instructions: "workflows/shared/03-summarize/instructions.md"
    input_dir: "{RUN_DIR}/enriched/"
    output_dir: "{RUN_DIR}/summarized/"
    timeout_min: 30
    max_retries: 2
  - name: verify
    instructions: "workflows/shared/04-verify/instructions.md"
    input_dir: "{RUN_DIR}/summarized/"
    output_dir: "{RUN_DIR}/verified/"
    timeout_min: 15
    max_retries: 2
  - name: send
    instructions: "workflows/shared/05-send/instructions.md"
    input_dir: "{RUN_DIR}/verified/"
    output_dir: "{RUN_DIR}/send-output/"
    timeout_min: 5
    max_retries: 1
  - name: publish
    instructions: "workflows/shared/06-publish/instructions.md"
    input_dir: "{RUN_DIR}/verified/"
    output_dir: "{RUN_DIR}/publish-output/"
    timeout_min: 15
    max_retries: 1
