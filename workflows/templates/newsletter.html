<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 1em;">

<!-- HEADER -->
<div style="text-align: center; margin-bottom: 2em;">
  <img src="https://poliscopic.com/static/poliscopic-logo.png" alt="Poliscopic" style="max-width: 200px;">
  <h1 style="color: #333; margin-top: 0.5em; margin-bottom: 0; font-size: 1.4em;">{{ TOPIC_NAME }}</h1>
  <p style="color: #666; margin-top: 0.3em;">{{ DATE }}</p>
</div>

<!-- SUMMARY -->
{{ SUMMARY_HTML }}

<!-- THIS PAST WEEK -->
<h2 style="color: #444; border-bottom: 2px solid #ddd; padding-bottom: 0.3em; margin-top: 2em;">This Past Week</h2>
{{ PAST_ITEMS_HTML }}

<!-- COMING UP -->
<h2 style="color: #444; border-bottom: 2px solid #ddd; padding-bottom: 0.3em; margin-top: 2em;">Coming Up</h2>
{{ UPCOMING_ITEMS_HTML }}

<!-- FOOTER -->
<hr style="border: none; border-top: 1px solid #ddd; margin: 2em 0;">
<p style="color: #999; font-size: 0.8em; text-align: center;">
  Poliscopic — Government Intelligence Platform
</p>
<p style="color: #bbb; font-size: 0.75em; text-align: center; margin-top: 1em;">
  {{ UNSUBSCRIBE_TEXT }}
</p>

</body>
</html>
